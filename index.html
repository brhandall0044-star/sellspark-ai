<title>Tet Ansanm — Haitian Marketplace</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f8;
  color:#171717;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
  background:#f7f7f8;
}

/* HEADER */

header{
  background:white;
  padding:18px 18px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
  border-bottom:1px solid #eeeeee;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.logo span{
  color:#e51b23;
}

.header-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:0;
  background:#f3f3f3;
  font-size:18px;
}

/* MAIN */

main{
  padding:14px 16px 20px;
}

/* SEARCH */

.search{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:15px;
  padding:13px 15px;
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
}

.search input{
  border:0;
  outline:0;
  width:100%;
  font-size:15px;
  background:transparent;
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#e51b23,#b5121b);
  color:white;
  border-radius:22px;
  padding:22px 20px;
  margin-bottom:18px;
}

.hero h1{
  margin:0 0 7px;
  font-size:29px;
  line-height:1.1;
}

.hero p{
  margin:0 0 16px;
  opacity:.9;
  line-height:1.4;
}

.sell-btn{
  background:white;
  color:#8e4843;
  border:0;
  border-radius:13px;
  padding:12px 17px;
  font-weight:bold;
}

/* SECTION */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 10px;
}

.section-head h2{
  font-size:19px;
  margin:0;
}

.section-head button{
  border:0;
  background:none;
  color:#e51b23;
  font-weight:bold;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:4px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;
  background:white;
  border:1px solid #e8e8e8;
  border-radius:14px;
  padding:10px 13px;
  font-size:13px;
  white-space:nowrap;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #ededed;
  position:relative;
}

.product-img{
  height:165px;
  background:#eeeeee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.product-body{
  padding:12px;
}

.product-name{
  font-weight:bold;
  font-size:14px;
  line-height:1.3;
  min-height:37px;
}

.price{
  font-size:19px;
  font-weight:800;
  margin-top:7px;
}

.seller{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.verified{
  color:#16834b;
  font-weight:bold;
}

.favorite{
  position:absolute;
  top:9px;
  right:9px;
  width:34px;
  height:34px;
  border-radius:50%;
  border:0;
  background:white;
  font-size:17px;
}

/* COUNTRY */

.countries{
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.country{
  min-width:125px;
  background:white;
  border:1px solid #eee;
  border-radius:16px;
  padding:14px;
}

.country b{
  display:block;
  margin-top:8px;
}

.country small{
  color:#777;
}

/* SAFETY */

.safety{
  background:#fff8ed;
  border:1px solid #f1dfbf;
  border-radius:18px;
  padding:16px;
  margin-top:22px;
}

.safety h3{
  margin-top:0;
}

.safety p{
  font-size:13px;
  line-height:1.5;
  color:#665;
}

/* CARDS */

.card{
  background:white;
  border-radius:19px;
  padding:17px;
  margin-bottom:13px;
  border:1px solid #ededed;
}

.card h2,
.card h3{
  margin-top:0;
}

.primary{
  width:100%;
  background:#e51b23;
  color:white;
  border:0;
  border-radius:13px;
  padding:14px;
  font-weight:bold;
}

.secondary{
  width:100%;
  background:#fde7e9;
  color:#8e1b23;
  border:0;
  border-radius:13px;
  padding:14px;
  font-weight:bold;
  margin-top:9px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  margin:6px 0;
  font-size:15px;
  background:white;
}

textarea{
  min-height:100px;
  resize:none;
}

/* DETAIL */

.detail-image{
  height:270px;
  background:#eee;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:90px;
  margin-bottom:15px;
}

.detail-price{
  font-size:30px;
  font-weight:800;
}

.rating{
  color:#e3a21a;
}

/* PROFILE */

.profile-top{
  text-align:center;
  background:white;
  border-radius:20px;
  padding:24px;
  margin-bottom:14px;
}

.avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#e7c4bf;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:30px;
}

.menu{
  background:white;
  border-radius:18px;
  overflow:hidden;
}

.menu button{
  width:100%;
  padding:16px;
  text-align:left;
  background:white;
  border:0;
  border-bottom:1px solid #eee;
  font-size:15px;
}

/* MESSAGES */

.message{
  background:white;
  padding:14px;
  border-radius:16px;
  margin-bottom:10px;
  border:1px solid #eee;
}

.message b{
  display:block;
  margin-bottom:5px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:100;
  display:none;
  align-items:flex-end;
}

.modal.show{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:430px;
  margin:auto;
  border-radius:24px 24px 0 0;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.close{
  float:right;
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
}

/* NAV */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:none;
  width:min(430px,100%);
  background:white;
  border-top:1px solid #e5e5e5;
  display:flex;
  justify-content:space-around;
  padding:8px 3px 9px;
  z-index:50;
}

nav button{
  border:0;
  background:none;
  color:#777;
  font-size:11px;
  padding:4px 7px;
}

nav button.active{
  color:#a6534c;
  font-weight:bold;
}

.sell-nav{
  color:white!important;
  background:#a6534c!important;
  border-radius:50%;
  width:46px;
  height:46px;
  font-size:18px!important;

/* EMPTY */

.empty{
  text-align:center;
  padding:45px 20px;
  color:#777;
}

/* AI TOOLS */

.output{
  background:#faf5f3;
  border-radius:14px;
  padding:14px;
  line-height:1.5;
  margin-bottom:10px;
}

.back{
  border:0;
  background:none;
  font-size:28px;
  padding:0 8px 0 0;
}

.page-title{
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:16px;
}

.page-title h2{
  margin:0;
}

/* LANGUAGE */

.language-row{
  display:flex;
  gap:8px;
  margin:10px 0;
}

.language-row button{
  flex:1;
  border:1px solid #ddd;
  background:white;
  padding:10px;
  border-radius:10px;

/* AI PRODUCT SCAN */

function aiScan(){

  const input=document.createElement("input");

  input.type="file";
  input.accept="image/*";

  input.onchange=function(){

    const file=input.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=function(e){

      const imageData=e.target.result;

      app.innerHTML=`

        <div class="page-title">
          <button class="back" onclick="profile()">‹</button>
          <h2>🤖 AI Product Scan</h2>
        </div>

        <div class="card">

          <img
            src="${imageData}"
            style="width:100%;border-radius:16px"
          >

          <h3>🤖 AI is identifying your product...</h3>

          <p>Please wait.</p>

        </div>
      `;

      analyzeImage(imageData);
    };

    reader.readAsDataURL(file);
  };

  input.click();
}

async function analyzeImage(imageData){

  try{

    const response=await fetch(
      "https://sellspark-ai-rho.vercel.app/api/analyze-image",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          image:imageData
        })
      }
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error || "AI analysis failed.");
    }

    const result=data.result || "No result returned.";

    app.innerHTML=`

      <div class="page-title">
        <button class="back" onclick="profile()">‹</button>
        <h2>✨ AI Product Results</h2>
      </div>

      <div class="card">

        <div class="output">
          ${escapeHTML(result).replace(/\n/g,"<br>")}
        </div>

        <button class="primary" onclick="listingBuilder()">
          📝 Create Listing
        </button>

      </div>
    `;

  }catch(error){

    app.innerHTML=`

      <div class="card">

        <h2>⚠️ AI Scan Error</h2>

        <p>${escapeHTML(error.message)}</p>

        <button class="primary" onclick="aiScan()">
          Try Again
        </button>

      </div>
    `;
  }
}

function calculateProfit(){

  const cost=Number(document.getElementById("profitCost").value);
  const shipping=Number(document.getElementById("profitShipping").value);
  const selling=Number(document.getElementById("profitSelling").value);
  const fees=Number(document.getElementById("profitFees").value);

  const profit=selling-cost-shipping-fees;
  const margin=selling>0?(profit/selling)*100:0;

  document.getElementById("profitResult").innerHTML=`

    <div class="card">

      <p>Estimated profit per sale</p>

      <div class="detail-price">
        $${profit.toFixed(2)}
      </div>

      <p>
        Estimated margin:
        <b>${margin.toFixed(1)}%</b>
      </p>

    </div>
  `;
}

/* MODAL */

function openModal(content){

  document.getElementById("modalBox").innerHTML=content;

  document.getElementById("modal").classList.add("show");
}

function closeModal(){

  document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").onclick=function(e){

  if(e.target===this){
    closeModal();
  }
};

/* SECURITY */

function escapeHTML(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
